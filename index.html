<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Chat</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="setup-screen" class="screen active">
      <div class="glass-card">
        <h1>Welcome to NetChat</h1>
        <p>Enter a username to join the network.</p>
        <form id="setup-form">
          <input id="username-input" placeholder="Username" required autocomplete="off" />
          <button type="submit">Join</button>
        </form>
        <div class="footer-credit">Made with ❤️ by Nandan Ray</div>
      </div>
    </div>

    <div id="chat-screen" class="screen">
      <div id="mobile-backdrop" class="mobile-backdrop hidden"></div>
      <aside class="sidebar" id="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 1.5rem 0 1.5rem;">
          <h2 style="padding: 0; border: none;">Active Peers</h2>
          <button id="close-sidebar-btn" class="mobile-only-btn" style="background: transparent; padding: 0.5rem; box-shadow: none;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <ul id="peer-list">
          <!-- Peers will be injected here -->
        </ul>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding: 0 1.5rem;">
          <h2 style="padding: 0; border: none;">Active Groups</h2>
          <button id="create-group-btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;">+ New</button>
        </div>
        <ul id="group-list" class="peer-list">
          <!-- Groups will be injected here -->
        </ul>
      </aside>
      
      <main class="chat-area">
        <header class="chat-header" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="sidebar-toggle-btn" class="header-icon-btn">
              <svg class="menu-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
              <svg class="back-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <h2 id="current-peer-name" style="margin: 0; font-size: 1.2rem;">Select a peer to chat</h2>
          </div>
          <div id="group-actions" class="hidden">
            <button id="add-member-btn" style="font-size: 0.8rem; padding: 0.3rem;">Add Member</button>
            <button id="remove-member-btn" style="font-size: 0.8rem; padding: 0.3rem; margin-left: 0.5rem; background: rgba(255,50,50,0.2);">Remove Member</button>
          </div>
        </header>
        
        <div id="messages-container">
          <!-- Messages will be injected here -->
          <div class="empty-state">No messages yet.</div>
        </div>
        
        <form id="chat-form" class="hidden">
          <button type="button" id="attach-btn" title="Send File">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>
          <button type="button" id="attach-folder-btn" title="Send Folder" style="background: rgba(255, 255, 255, 0.1); padding: 0.75rem; border-radius: 0.5rem; color: white; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </button>
          <input id="message-input" placeholder="Type a message..." autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </main>
    </div>

    <!-- Modals -->
    <div id="create-group-modal" class="modal hidden">
      <div class="modal-content glass-card">
        <h3>Create New Group</h3>
        <input id="new-group-name" placeholder="Group Name" autocomplete="off" />
        <div class="modal-actions">
          <button id="cancel-create-group-btn" class="secondary-btn">Cancel</button>
          <button id="confirm-create-group-btn">Create</button>
        </div>
      </div>
    </div>

    <div id="add-member-modal" class="modal hidden">
      <div class="modal-content glass-card">
        <h3>Add Members</h3>
        <div id="available-peers-list" class="checkbox-list">
          <!-- Peers injected here -->
        </div>
        <div class="modal-actions">
          <button id="cancel-add-member-btn" class="secondary-btn">Cancel</button>
          <button id="confirm-add-member-btn">Add Selected</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
